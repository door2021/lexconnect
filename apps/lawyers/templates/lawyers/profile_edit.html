{% extends "base.html" %}
{% load i18n %}
{% block title %}{% translate "Edit profile" %} · {{ SITE_NAME }}{% endblock %}
{% block content %}
<div class="mx-auto max-w-2xl">
  {% include "partials/settings_nav.html" %}
  <form method="post" class="space-y-4 rounded-lg border border-slate-200 bg-white p-6 shadow-sm" novalidate>
    {% csrf_token %}
    {{ form }}
    <button type="submit" class="btn-primary">{% translate "Save profile" %}</button>
  </form>
</div>
{% endblock %}
