{% extends "base.html" %}
{% load i18n %}
{% block title %}{{ heading }} · {{ SITE_NAME }}{% endblock %}
{% block content %}
<div class="mx-auto max-w-md rounded-lg border border-slate-200 bg-white p-8 shadow-sm">
  <h1 class="text-2xl font-semibold">{{ heading }}</h1>
  <p class="mt-3 text-sm text-slate-600">{{ message }}</p>
  <a href="{% if user.is_authenticated %}{% url 'home' %}{% else %}{% url 'accounts:login' %}{% endif %}" class="btn-primary mt-6">{% translate "Continue" %}</a>
</div>
{% endblock %}
