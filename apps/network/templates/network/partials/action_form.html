<form method="post" action="{{ url }}"
      hx-post="{{ url }}" hx-target="closest .connect-button" hx-swap="outerHTML">
  {% csrf_token %}
  <input type="hidden" name="next" value="{{ next }}">
  <button type="submit" class="{% if style == 'primary' %}btn-primary px-3 py-1{% else %}text-slate-500 hover:text-brand-700{% endif %}">{{ label }}</button>
</form>
