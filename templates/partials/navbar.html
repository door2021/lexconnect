{% load i18n %}
<header class="border-b border-slate-200 bg-white">
  <nav class="mx-auto flex max-w-5xl items-center justify-between px-4 py-3">
    <a href="{% url 'home' %}" class="text-lg font-bold text-brand-800">{{ SITE_NAME }}</a>
    <div class="flex items-center gap-4 text-sm">
      {% if user.is_authenticated %}
        {% if user.lawyer_profile %}
          <a href="{% url 'lawyers:profile' user.handle %}" class="text-slate-600 hover:text-brand-700">@{{ user.handle }}</a>
          <a href="{% url 'lawyers:profile_edit' %}" class="text-slate-600 hover:text-brand-700">{% translate "Settings" %}</a>
        {% endif %}
        <form method="post" action="{% url 'accounts:logout' %}">
          {% csrf_token %}
          <button type="submit" class="text-slate-600 hover:text-brand-700">{% translate "Log out" %}</button>
        </form>
      {% else %}
        <a href="{% url 'accounts:login' %}" class="text-slate-600 hover:text-brand-700">{% translate "Log in" %}</a>
        <a href="{% url 'lawyers:signup' %}" class="btn-primary">{% translate "Join" %}</a>
      {% endif %}
    </div>
  </nav>
</header>
