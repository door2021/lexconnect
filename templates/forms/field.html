<div class="field space-y-1">
  {% if field.use_fieldset %}<fieldset>{% if field.label %}{{ field.legend_tag }}{% endif %}
  {% elif field.label %}<label for="{{ field.id_for_label }}" class="block text-sm font-medium text-slate-700">{{ field.label }}{% if not field.field.required %} <span class="font-normal text-slate-400">(optional)</span>{% endif %}</label>{% endif %}
  {{ field }}
  {% if field.help_text %}<p class="text-xs text-slate-500" id="{{ field.auto_id }}_helptext">{{ field.help_text|safe }}</p>{% endif %}
  {% for error in field.errors %}<p class="text-sm text-red-600">{{ error }}</p>{% endfor %}
  {% if field.use_fieldset %}</fieldset>{% endif %}
</div>
